name: Reproduce Boolean Invariant Separation

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: boolean-invariant-reproduction
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m bislab.verify_witness
      - run: python -m bislab.small_dimension_audit
      - run: python -m bislab.exhaustive_quadratic_search --n 5
      - run: python -m bislab.analyze_collisions
      - uses: actions/upload-artifact@v4
        with:
          name: boolean-invariant-separation-artifacts
          path: artifacts/
