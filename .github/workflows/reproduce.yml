name: Reproduce Boolean Invariant Separation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - run: python -m bislab.verify_witness
      - run: python -m bislab.exhaustive_quadratic_search --n 5
      - uses: actions/upload-artifact@v4
        with:
          name: boolean-invariant-separation-artifacts
          path: artifacts/
